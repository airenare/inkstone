
{% extends "base.html" %}

{% block content %}

<h2>Search</h2>

<form action="/search">

<input type="text" name="q" value="{{ query }}">

<button type="submit">Search</button>

</form>

{% if posts %}

<h3>Results</h3>

<ul>

{% for post in posts %}

<li>
<a href="/post/{{ post.slug }}">{{ post.title }}</a>
</li>

{% endfor %}

</ul>

{% endif %}

{% endblock %}
