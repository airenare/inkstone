
{% extends "base.html" %}

{% block meta %}
<meta property="og:title" content="{{ post.title }}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{ current_url }}">
<meta property="og:description" content="{{ post.summary }}">
{% if post.banner %}<meta property="og:image" content="{{ post.banner }}">{% endif %}
<meta name="twitter:card" content="{{ 'summary_large_image' if post.banner else 'summary' }}">
<meta name="twitter:title" content="{{ post.title }}">
<meta name="twitter:description" content="{{ post.summary }}">
{% if post.banner %}<meta name="twitter:image" content="{{ post.banner }}">{% endif %}
{% endblock %}

{% block content %}

{% if post.banner %}
<div class="page-banner" style="background-image: url('{{ post.banner }}'); background-position: {{ ((post.banner_x or 0.5) * 100)|int }}% {{ ((post.banner_y or 0.5) * 100)|int }}%;"></div>
{% endif %}

<a href="{{ back_url }}">← Back</a>

<article>

<h1>{{ post.title }}</h1>

{{ post.html | safe }}

</article>

{% endblock %}
