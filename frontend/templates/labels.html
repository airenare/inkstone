
{% extends "base.html" %}

{% block meta %}
<meta property="og:title" content="Tags — {{ website_name }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ canonical_url }}">
{% endblock %}

{% block content %}

<h2>Tags</h2>

{% if labels %}
<ul class="labels-index">
{% for label, count in labels %}
<li>
  <a href="/tag/{{ label }}" class="labels-index-link">{{ label }}</a>
  <span class="labels-index-count">{{ count }}</span>
</li>
{% endfor %}
</ul>
{% else %}
<p>No tags yet.</p>
{% endif %}

{% endblock %}
